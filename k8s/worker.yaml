apiVersion: apps/v1
kind: Deployment
metadata:
  name: astraea-worker
  namespace: astraea
  labels:
    app.kubernetes.io/name: astraea
    app.kubernetes.io/component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: astraea-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astraea-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: astraea-service-account
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ghcr.io/angelp17/astraea/worker:latest
          imagePullPolicy: Always
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: WORKER_TYPE
              value: "celery"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: astraea-api-config
                  key: LOG_LEVEL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: astraea-api-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: astraea-api-config
                  key: REDIS_PORT
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: astraea-secrets
                  key: SECRET_KEY
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: astraea-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: astraea-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: astraea-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: astraea-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: astraea-secrets
                  key: DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A backend.worker.celery_app inspect ping -d "celery@${HOSTNAME}" | grep -q pong
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A backend.worker.celery_app inspect ping -d "celery@${HOSTNAME}" | grep -q pong
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: artifacts-volume
              mountPath: /app/artifacts
      volumes:
        - name: artifacts-volume
          persistentVolumeClaim:
            claimName: astraea-artifacts-pvc
