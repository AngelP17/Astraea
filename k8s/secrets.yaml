apiVersion: v1
kind: Secret
metadata:
  name: astraea-secrets
  namespace: astraea
  labels:
    app.kubernetes.io/name: astraea
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Template only for local or manual cluster setup.
  # CI/CD creates the live secret from GitHub Actions secrets instead of applying
  # this manifest directly.
  SECRET_KEY: "change-me-in-production-use-k8s-secrets"
  DB_HOST: "astraea-db.astraea.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "astraea"
  DB_USER: "astraea_user"
  DB_PASSWORD: "change-me-in-production"
